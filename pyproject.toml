[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syspanel"
version = "0.1.0"
description = "A PC hardware monitor for external LCD and OLED displays"
requires-python = ">=3.10"

dependencies = [
    "psutil",
    "pyserial",
]

[project.scripts]
syspanel = "syspanel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
